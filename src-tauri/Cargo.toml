[package]
name = "murmur"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Local, private dictation"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
cpal = "0.15"
enigo = { version = "0.2", default-features = false, features = ["x11rb"] }
arboard = "3"
rodio = { version = "0.20", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
notify = "8"
rusqlite = { version = "0.37", features = ["bundled"] }
# Protocol encoding, safe whole-word replacements, and QA WAV input.
base64 = "0.22"
regex = "1"
hound = "3.5"
# Atomic replacement of existing configuration files on Windows.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
