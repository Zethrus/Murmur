[package]
name = "murmur"
version = "0.3.1"
edition = "2021"
rust-version = "1.85"
description = "Local, private dictation"

[features]
default = ["enhance-llama"]
custom-protocol = ["tauri/custom-protocol"]
# In-process CPU-only llama.cpp backend for Enhance. Without it, Enhance reports
# `backend_unavailable` and dictation is unaffected.
enhance-llama = ["dep:llama-cpp-2", "dep:llama-cpp-sys-2"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
cpal = "0.15"
enigo = { version = "0.2", default-features = false, features = ["x11rb"] }
arboard = "3"
# Direct X11 access for modifier-state polling before synthetic typing.
x11rb = { version = "0.13", default-features = false, features = ["shape"] }

rodio = { version = "0.20", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
notify = "8"
rusqlite = { version = "0.37", features = ["bundled"] }
# Protocol encoding, safe whole-word replacements, and QA WAV input.
base64 = "0.22"
regex = "1"
hound = "3.5"
# Enhance: explicit model download (HTTPS only, rustls) and streaming integrity checks.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
tokio = { version = "1", features = ["rt", "time", "macros"] }
sha2 = "0.10"
# Enhance: exact pins; wrapper defaults (openmp, GPU backends) disabled. The sys crate's own
# "common" default is pulled in by the wrapper; no GPU backend feature is enabled anywhere.
llama-cpp-2 = { version = "=0.1.160", default-features = false, optional = true }
llama-cpp-sys-2 = { version = "=0.1.160", default-features = false, optional = true }
btleplug = "0.11"
futures = "0.3"
# Free-space check before an explicit Enhance model download.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
[target.'cfg(target_os = "linux")'.dev-dependencies]
gdkx11 = "0.18"
# Atomic replacement of existing configuration files on Windows.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
