name: Flipper companion

# Builds only the Flipper app. Anything under companion/flipper triggers it, plus the
# release workflow for a v* tag.
on:
  push:
    branches: ['**']
    paths:
      - 'companion/flipper/**'
      - '.github/workflows/flipper-build.yml'
  pull_request:
    paths:
      - 'companion/flipper/**'
      - '.github/workflows/flipper-build.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Same runner pool as the desktop build: the account is billing-locked for hosted
    # runners, and the self-hosted machine already has the toolchain cached.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || vars.LINUX_RUNNER == ''
    timeout-minutes: 20
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '["ubuntu-22.04"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ufbt
        run: |
          python -m pip install --upgrade pip
          python -m pip install ufbt

      - name: Prepare the SDK
        run: ufbt update --channel=release

      - name: Sync the companion version with Murmur
        run: python3 companion/flipper/scripts/sync_version.py --check

      - name: Test the wire parser
        run: |
          cc -std=c11 -Wall -Wextra -o /tmp/protocol_test companion/tests/protocol_test.c companion/flipper/src/protocol.c
          /tmp/protocol_test

      - name: Build the app
        run: ufbt
        working-directory: companion/flipper

      - name: Verify the artifact
        run: |
          set -euo pipefail
          test -s dist/murmur_companion.fap
          ls -l dist/murmur_companion.fap
        working-directory: companion/flipper

      # Optional: this account's artifact quota is exhausted, and the release attach below is
      # the real delivery path, so the upload is opt-in rather than a hard gate.
      - uses: actions/upload-artifact@v4
        if: vars.ENABLE_ARTIFACTS == 'true'
        with:
          name: murmur-companion-fap
          path: companion/flipper/dist/murmur_companion.fap
          if-no-files-found: error

      # Attach to the release on a tag, the same way the desktop workflows do, so the
      # release never depends on Actions artifact storage.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp companion/flipper/dist/murmur_companion.fap "murmur-companion-${GITHUB_REF_NAME}.fap"
          gh release upload "${GITHUB_REF_NAME}" "murmur-companion-${GITHUB_REF_NAME}.fap" --clobber
