name: Windows build

on:
  # Releases build on v* tags through release.yml. Branch pushes do not trigger a full build:
  # one self-hosted runner means every push would queue a 20-minute job, and Actions artifact
  # storage on this account is small.
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Fork PRs must never execute on a self-hosted runner; keep them on hosted or skip.
    # Fork PRs never run here. Tag builds wait for a real Windows runner instead of failing
    # against a billing-locked hosted runner.
    if: >-
      vars.ENABLE_WINDOWS == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository ||
       vars.WINDOWS_RUNNER == '') &&
      (vars.WINDOWS_RUNNER != '' || !startsWith(github.ref, 'refs/tags/'))
    runs-on: ${{ fromJSON(vars.WINDOWS_RUNNER || '["windows-latest"]') }}
    timeout-minutes: 90
    env:
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
      PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
      PYINSTALLER_CONFIG_DIR: ${{ github.workspace }}/.cache/pyinstaller
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Isolate the CI Rust toolchain
        shell: pwsh
        run: |
          $Root = Join-Path $env:RUNNER_TOOL_CACHE 'murmur-ci'
          New-Item -ItemType Directory -Force "$Root/rustup", "$Root/cargo" | Out-Null
          "RUSTUP_HOME=$Root/rustup" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CARGO_HOME=$Root/cargo" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$Root/cargo/bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Freeze the engine sidecar
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m venv engine/.venv
          $Python = (Resolve-Path 'engine/.venv/Scripts/python.exe').Path
          & $Python -m pip install --upgrade pip
          & $Python -m pip install -r engine/requirements.txt pyinstaller
          if ($LASTEXITCODE -ne 0) { throw 'pip install failed' }
          Push-Location engine
          try {
            # Onedir engine; CUDA DLLs are found through MURMUR_CUDA_DIR (murmur_engine/runtime.py).
            & $Python -m PyInstaller --noconfirm --clean --onedir --name murmur-engine `
              --paths . --exclude-module av --exclude-module hf_xet `
              --collect-all faster_whisper --collect-all ctranslate2 `
              --collect-all tokenizers --collect-binaries onnxruntime --collect-data onnxruntime `
              --hidden-import onnxruntime.capi._pybind_state murmur_engine/__main__.py
            if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed' }
          } finally { Pop-Location }
          & engine/dist/murmur-engine/murmur-engine.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'frozen engine did not start' }

      - run: npm ci

      - run: npm run build
      - run: npm run test:ui
      - name: Provision and initialize Windows native toolchain
        shell: pwsh
        run: . ./scripts/prepare-windows-native.ps1
      - name: Test Rust including unavailable Enhance backend
        shell: pwsh
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Rust tests failed' }
          cargo test --manifest-path src-tauri/Cargo.toml --no-default-features
          if ($LASTEXITCODE -ne 0) { throw 'Rust tests without Enhance backend failed' }
      - name: Build the app and NSIS installer
        env:
          RUSTFLAGS: -C target-cpu=x86-64
          GGML_NATIVE: 'OFF'
          GGML_AVX512: 'OFF'
          GGML_AVX: 'ON'
          GGML_AVX2: 'ON'
          GGML_FMA: 'ON'
          GGML_F16C: 'ON'
          GGML_BMI2: 'ON'
          GGML_SSE42: 'ON'
          GGML_CPU_ALL_VARIANTS: 'OFF'
        run: npx tauri build --target x86_64-pc-windows-msvc

      - name: Audit linked native CPU baseline
        shell: pwsh
        run: |
          python scripts/audit-llama-cpu.py src-tauri/target/x86_64-pc-windows-msvc/release
          if ($LASTEXITCODE -ne 0) { throw 'Unsupported native CPU baseline' }

      - name: Verify and stage unsigned artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Release = 'src-tauri/target/x86_64-pc-windows-msvc/release'
          $Destination = '.cache/artifacts/windows'
          New-Item -ItemType Directory -Force $Destination | Out-Null
          # Portable layout the app resolves: murmur.exe + engine\murmur-engine.exe (onedir).
          $File = Join-Path $Release 'murmur.exe'
          if (-not (Test-Path $File) -or (Get-Item $File).Length -eq 0) {
            throw "Missing or empty portable artifact: $File"
          }
          $Portable = Join-Path $Destination 'portable'
          New-Item -ItemType Directory -Force $Portable | Out-Null
          Copy-Item $File $Portable -Force
          Copy-Item engine/dist/murmur-engine (Join-Path $Portable 'engine') -Recurse -Force
          # The NSIS installer does not include the engine yet (PR-B/PR-C components).
          $Installers = @(Get-ChildItem "$Release/bundle/nsis/*.exe" -File)
          if ($Installers.Count -eq 0) { throw 'Missing NSIS installer' }
          $Installers | Copy-Item -Destination $Destination
          Compress-Archive -Path "$Portable/*" -DestinationPath "$Destination/murmur-windows-x86_64.zip" -Force
          Remove-Item $Portable -Recurse -Force

      - name: Publish Windows assets to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Unsigned builds. Windows runtime and GPU behavior remain unverified on real Windows hardware.
            The portable zip includes the engine folder beside murmur.exe; keep them together.
            Models are not bundled: install a model explicitly in Settings → Engine.
          files: .cache/artifacts/windows/*
          fail_on_unmatched_files: true
      - name: Upload build artifacts (best effort)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: murmur-windows-x86_64
          path: .cache/artifacts/windows/*
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
