name: Windows build

# Runs on vars.WINDOWS_RUNNER (the self-hosted "Edison" machine: self-hosted, Windows, X64, gpu,
# nvidia), falling back to windows-latest once hosted billing is unlocked. Nothing here has run
# yet: the workflow was written without a Windows machine (see docs/ci-windows.md).
#
# Pull requests and manual runs build, test and upload throwaway-signed artifacts (never a
# release); their murmur.exe embeds the throwaway-signed manifest (trusted only with
# MURMUR_DEV_TRUST_ROOT + ACK), and on Edison the build is handed to the desktop runner through
# C:\murmur-ci-out (windows-desktop.yml). Release tags arrive through release.yml
# (workflow_call): nothing is embedded, a guard re-checks that before upload, the Windows assets
# go to the draft release only, and the component inputs are handed to the Linux signing job.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      gpu:
        description: Also run the GPU inference matrix on the NVIDIA runner (needs vars.WINDOWS_GPU_TEST_MODELS)
        type: boolean
        default: false
  workflow_call:
    outputs:
      windows_inputs:
        description: components-windows-inputs.json (sizes and SHA-256 of the Windows component zips)
        value: ${{ jobs.build.outputs.windows_inputs }}

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    # Fork pull requests never reach a self-hosted runner: they run only when WINDOWS_RUNNER is
    # unset (hosted). Tags need the real runner; they never fall back to a billing-locked host.
    if: >-
      vars.ENABLE_WINDOWS == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository ||
       vars.WINDOWS_RUNNER == '') &&
      (vars.WINDOWS_RUNNER != '' || !startsWith(github.ref, 'refs/tags/'))
    runs-on: ${{ fromJSON(vars.WINDOWS_RUNNER || '["windows-latest"]') }}
    timeout-minutes: 150
    outputs:
      windows_inputs: ${{ steps.inputs.outputs.json }}
    env:
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
      PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
      PYINSTALLER_CONFIG_DIR: ${{ github.workspace }}/.cache/pyinstaller
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      # Ninja (bundled with Visual Studio) instead of the default Visual Studio generator: the
      # CPU audit reads llama.cpp's compiler flags from build.ninja; .vcxproj files are not audited.
      CMAKE_GENERATOR: Ninja
      CARGO_BUILD_JOBS: '2'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Allow Windows PowerShell scripts for the runner user
        # actions/setup-python and setup-node run their setup.ps1 through Windows PowerShell 5.1,
        # whose default policy on client Windows is Restricted ("running scripts is disabled on
        # this system"). pwsh 7 keeps its own policy, so set 5.1's CurrentUser value directly;
        # CurrentUser beats LocalMachine and only a Group Policy can override it.
        shell: pwsh
        run: |
          $Key = 'HKCU:\Software\Microsoft\PowerShell\1\ShellIds\Microsoft.PowerShell'
          New-Item -Path $Key -Force | Out-Null
          Set-ItemProperty -Path $Key -Name ExecutionPolicy -Value RemoteSigned
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -Command 'Get-ExecutionPolicy -List'

      - name: Prefer Git Bash over the WSL launcher for bash steps
        # The runner resolves `bash` through PATH. On a machine with WSL enabled that finds
        # C:\Windows\System32\bash.exe (the WSL launcher) first, which cannot run under the
        # service user and exits without output. winget's Git adds only Git\cmd to PATH.
        shell: pwsh
        run: |
          # Walk up from git.exe (Git\cmd, Git\bin or Git\mingw64\bin) to the folder holding bin\bash.exe.
          $Dir = Split-Path (Get-Command git.exe).Source
          while ($Dir -and -not (Test-Path (Join-Path $Dir 'bin\bash.exe'))) { $Dir = Split-Path $Dir }
          if (-not $Dir) { throw "Git Bash (bin\bash.exe) not found above $((Get-Command git.exe).Source)" }
          $Bin = Join-Path $Dir 'bin'
          $Bin | Out-File -FilePath $env:GITHUB_PATH -Append
          & (Join-Path $Bin 'bash.exe') --version | Select-Object -First 1

      - uses: actions/setup-python@v5
        # Hosted runners only: on a self-hosted machine this action runs the Python MSI and
        # deletes HKLM registry keys, which the non-admin runner user cannot do.
        if: runner.environment != 'self-hosted'
        with:
          python-version: '3.12'
          architecture: x64

      - name: Use the machine-wide Python 3.12 (self-hosted runner)
        if: runner.environment == 'self-hosted'
        shell: pwsh
        run: |
          $Python = & py -3.12 -c "import sys; print(sys.executable)"
          if ($LASTEXITCODE -ne 0 -or -not $Python) {
            throw 'Python 3.12 is not installed machine-wide; run scripts/windows/provision-runner.ps1'
          }
          $Dir = Split-Path $Python
          "$Dir`n$Dir\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Append
          "pythonLocation=$Dir" | Out-File -FilePath $env:GITHUB_ENV -Append
          & $Python --version

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Isolate the CI Rust toolchain
        shell: pwsh
        run: |
          $Root = Join-Path $env:RUNNER_TOOL_CACHE 'murmur-ci'
          New-Item -ItemType Directory -Force "$Root/rustup", "$Root/cargo" | Out-Null
          "RUSTUP_HOME=$Root/rustup" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CARGO_HOME=$Root/cargo" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$Root/cargo/bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Provision and initialize the Windows native toolchain
        shell: pwsh
        run: . ./scripts/prepare-windows-native.ps1

      - name: Freeze the engine (hash-locked wheels) and run the cuDNN/NVRTC gate (pefile + site-packages)
        shell: pwsh
        run: ./scripts/windows/freeze-engine.ps1

      - run: npm ci
      - run: npm run build
      - run: npm run test:ui

      - name: Script tests (release checks, PE gate, Windows components, inference core, desktop harness)
        shell: pwsh
        run: |
          # The Linux packaging tests need readelf, symlinks and dpkg; they run in linux-build.yml.
          Push-Location scripts/tests
          python -m unittest test_release test_engine_imports test_windows_components test_inference_common test_windows_ci test_cpu_audit test_embedded_manifest test_desktop_harness
          $Code = $LASTEXITCODE
          Pop-Location
          if ($Code -ne 0) { throw 'Script tests failed' }

      - name: Engine tests
        shell: pwsh
        run: |
          engine/.release-venv/Scripts/python.exe -m pip install pytest
          engine/.release-venv/Scripts/python.exe -m pytest engine/tests -q
          if ($LASTEXITCODE -ne 0) { throw 'Engine tests failed' }

      - name: Rust tests (with and without the Enhance backend)
        shell: pwsh
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Rust tests failed' }
          cargo test --manifest-path src-tauri/Cargo.toml --no-default-features
          if ($LASTEXITCODE -ne 0) { throw 'Rust tests without Enhance backend failed' }

      - name: Build the component zips (engine, cuBLAS add-on) before the app
        shell: pwsh
        run: |
          ./scripts/windows/package.ps1 -ComponentsOnly |
            Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Throwaway-signed Windows manifest (pull requests and manual runs; never released)
        # Before `tauri build`, so pull-request and manual builds can embed it (setup and
        # download checks on the desktop runner). The throwaway certificate stays next to it as
        # murmur-release.asc; the app trusts it only with MURMUR_DEV_TRUST_ROOT + ACK.
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          components=.cache/artifacts/components-windows
          # Git Bash's gpg is an MSYS program: it reads S:/... as a relative path, so hand it
          # the POSIX form (/s/...) of the runner's temp directory.
          key="$(cygpath -u "$RUNNER_TEMP")/murmur-throwaway-key"
          rm -rf "$key"
          scripts/components/dev-key.sh "$key" >/dev/null
          sleep 1
          python scripts/components/make-manifest.py --components "$components" --version "$version" --os windows \
            --windows-inputs "$components/components-windows-inputs.json" \
            --output "$components/components-manifest.json"
          GNUPGHOME="$key" scripts/components/sign-manifest.sh "$components/components-manifest.json" "$components/murmur-release.asc"
          gpgconf --homedir "$key" --kill all || true
          rm -rf "$key"

      # Release tags only: pull-request and manual builds never receive the certificate secrets,
      # never hold the key in the runner's certificate store and never produce signed artifacts.
      - name: Import the Authenticode certificate (tags only; dormant until the secrets exist)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: ./scripts/windows/authenticode.ps1 -Import

      - name: Build murmur.exe and the per-user NSIS installer
        shell: pwsh
        env:
          # Pull requests and manual runs embed the throwaway-signed manifest (as Linux does) so the
          # first-run setup has a catalog on the desktop runner. Never on tags: a release binary
          # embeds nothing signed by a throwaway key (the release guard below re-checks this).
          EMBED_TEST_MANIFEST: ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && !startsWith(github.ref, 'refs/tags/') }}
          RUSTFLAGS: -C target-cpu=x86-64
          GGML_NATIVE: 'OFF'
          GGML_AVX512: 'OFF'
          GGML_AVX: 'ON'
          GGML_AVX2: 'ON'
          GGML_FMA: 'ON'
          GGML_F16C: 'ON'
          GGML_BMI2: 'ON'
          GGML_SSE42: 'ON'
          GGML_CPU_ALL_VARIANTS: 'OFF'
        run: |
          if ($env:EMBED_TEST_MANIFEST -eq 'true') {
            # build.rs embeds <manifest> and <manifest>.sig; a full path (no 8.3 short names).
            $Manifest = (Get-Item -LiteralPath '.cache/artifacts/components-windows/components-manifest.json').FullName
            if (-not (Test-Path -LiteralPath "$Manifest.sig")) { throw "Missing $Manifest.sig" }
            $env:MURMUR_EMBED_MANIFEST = $Manifest
            Write-Host "Embedding the throwaway-signed test manifest: $Manifest"
          } else {
            Remove-Item Env:MURMUR_EMBED_MANIFEST -ErrorAction SilentlyContinue
            Write-Host 'No embedded manifest (release tag or workflow_call).'
          }
          $TauriArgs = @('tauri', 'build', '--target', 'x86_64-pc-windows-msvc')
          if ($env:MURMUR_SIGN_THUMBPRINT -and $env:GITHUB_REF -like 'refs/tags/*') {
            $Config = Join-Path $env:RUNNER_TEMP 'tauri.sign.conf.json'
            $Command = "powershell -NoProfile -ExecutionPolicy Bypass -File `"$PWD\scripts\windows\authenticode.ps1`" -Sign %1"
            @{ bundle = @{ windows = @{ signCommand = $Command } } } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 $Config
            $TauriArgs += @('--config', $Config)
            Write-Host 'Signing murmur.exe and the installer with the imported Authenticode certificate.'
          } else {
            Write-Host 'Unsigned build: no Authenticode certificate configured.'
            '**Unsigned**: no Authenticode certificate configured.' | Out-File $env:GITHUB_STEP_SUMMARY -Append
          }
          npx @TauriArgs
          if ($LASTEXITCODE -ne 0) { throw 'tauri build failed' }

      - name: Remove the Authenticode certificate
        if: always()
        shell: pwsh
        run: ./scripts/windows/authenticode.ps1 -Remove

      - name: Audit linked native CPU baseline
        shell: pwsh
        run: |
          python scripts/audit-llama-cpu.py src-tauri/target/x86_64-pc-windows-msvc/release
          if ($LASTEXITCODE -ne 0) { throw 'Unsupported native CPU baseline' }

      - name: Package installer and portable zip; enforce size budgets
        shell: pwsh
        run: |
          ./scripts/windows/package.ps1 -SkipComponents -Release src-tauri/target/x86_64-pc-windows-msvc/release |
            Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Startup smoke test (--version, --help)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Work = Join-Path $env:RUNNER_TEMP 'murmur-smoke-cli'
          if (Test-Path $Work) { Remove-Item -Recurse -Force $Work }
          Expand-Archive .cache/artifacts/windows/murmur-windows-x86_64.zip $Work
          $App = Join-Path $Work 'murmur.exe'
          # GUI-subsystem binary: piping makes PowerShell wait and capture stdout.
          $Version = (& $App --version | Out-String).Trim()
          $Expected = "murmur $((Get-Content -Raw package.json | ConvertFrom-Json).version)"
          if ($Version -ne $Expected) { throw "--version printed '$Version', expected '$Expected'" }
          $Help = & $App --help | Out-String
          if ($Help -notmatch '--background') { throw '--help output is incomplete' }
          Write-Host '--version and --help OK.'

      # Hosted runners only: the self-hosted runner is a Windows service (session 0), where the
      # tray (Shell_NotifyIcon needs a shell) and WebView2 are unavailable, so a launch there
      # would fail for reasons unrelated to Murmur. On Edison the launch is covered by the
      # interactive checklist in the logged-in session (docs/ci-windows.md).
      - name: Startup smoke test (launch without an engine; hosted runners only)
        if: vars.WINDOWS_RUNNER == ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Work = Join-Path $env:RUNNER_TEMP "murmur-smoke-$([guid]::NewGuid())"
          Expand-Archive .cache/artifacts/windows/murmur-windows-x86_64.zip $Work
          $App = Join-Path $Work 'murmur.exe'
          # Throwaway profile; the runner's own profile is never touched.
          $env:APPDATA = Join-Path $Work 'Roaming'
          $env:LOCALAPPDATA = Join-Path $Work 'Local'
          New-Item -ItemType Directory -Force $env:APPDATA, $env:LOCALAPPDATA | Out-Null
          $Process = Start-Process $App -ArgumentList '--background' -PassThru
          $Exited = $Process.WaitForExit(10000)
          $Log = Join-Path $env:LOCALAPPDATA 'Murmur\murmur.log'
          if (Test-Path $Log) { Get-Content $Log -Tail 40 }
          if ($Exited -and $Process.ExitCode -ne 0) { throw "murmur.exe exited with $($Process.ExitCode) within 10 s" }
          if (-not $Exited) { Stop-Process -Id $Process.Id -Force }
          if (-not (Test-Path (Join-Path $env:APPDATA 'Murmur\config.toml'))) { throw 'No config written: the app did not start' }
          if (Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Murmur') -Recurse -Filter 'murmur-engine.exe' -ErrorAction SilentlyContinue) {
            throw 'An engine appeared without an explicit install'
          }
          Write-Host 'murmur.exe started without an engine and did not crash within 10 s.'

      - name: GPU validation on the NVIDIA runner (manual runs with gpu=true)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.gpu }}
        shell: pwsh
        env:
          WINDOWS_GPU_TEST_MODELS: ${{ vars.WINDOWS_GPU_TEST_MODELS }}
        run: |
          if (-not $env:WINDOWS_GPU_TEST_MODELS) { throw 'Set vars.WINDOWS_GPU_TEST_MODELS (staged offline models) first.' }
          if (-not (Get-Command nvidia-smi -ErrorAction SilentlyContinue)) { throw 'nvidia-smi not found: NVIDIA runner required.' }
          nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv
          python scripts/test-windows-inference.py --artifacts .cache/artifacts/windows `
            --components .cache/artifacts/components-windows --models-dir $env:WINDOWS_GPU_TEST_MODELS
          if ($LASTEXITCODE -ne 0) { throw 'Windows GPU validation failed' }

      - name: Hand the component inputs to the release
        id: inputs
        shell: pwsh
        run: |
          $Json = Get-Content -Raw .cache/artifacts/components-windows/components-windows-inputs.json | ConvertFrom-Json | ConvertTo-Json -Depth 8 -Compress
          "json=$Json" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Release guard - no throwaway-signed manifest in the shipped binaries (tags only)
        # Fails if murmur.exe (target folder and portable zip) embeds a manifest signed by any key
        # other than the committed release certificate; with no certificate, nothing may be
        # embedded. The NSIS installer is compressed and wraps the same murmur.exe.
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          python scripts/check-embedded-manifest.py --trusted-cert src-tauri/trust/murmur-release.asc `
            src-tauri/target/x86_64-pc-windows-msvc/release/murmur.exe .cache/artifacts/windows/murmur-windows-x86_64.zip
          if ($LASTEXITCODE -ne 0) { throw 'A release binary embeds a throwaway-signed manifest' }

      - name: Attach Windows assets to the draft release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Draft = gh release view $env:GITHUB_REF_NAME --json isDraft | ConvertFrom-Json
          if (-not $Draft.isDraft) { throw 'Published releases are immutable; never upload to them' }
          $Version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          gh release upload $env:GITHUB_REF_NAME `
            ".cache/artifacts/windows/Murmur_${Version}_x64-setup.exe" `
            .cache/artifacts/windows/murmur-windows-x86_64.zip `
            ".cache/artifacts/components-windows/murmur-engine-windows-x86_64-$Version.zip" `
            ".cache/artifacts/components-windows/murmur-cuda-windows-x86_64-$Version.zip" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Upload to the draft release failed' }

      - name: Upload throwaway-signed build artifacts (best effort, never released)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: murmur-windows-x86_64-untrusted-dev-signed
          path: |
            .cache/artifacts/windows/*
            .cache/artifacts/components-windows/components-manifest.json*
            .cache/artifacts/components-windows/murmur-release.asc
            .cache/artifacts/components-windows/components-windows-inputs.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      # The desktop runner (docs/ci-windows.md) cannot receive artifacts (billing lock), so the
      # build is handed over through a local folder on Edison. The desktop job re-checks every
      # file against SHA256SUMS and against the MURMUR-HANDOFF-SHA256 lines printed below in
      # this job's log, so a modified folder is refused before anything runs.
      # Manual runs only: a pull-request run (possibly from a fork, after approval) must not be
      # able to write into or prune the hand-off folder.
      - name: Hand the build to the desktop runner (self-hosted; manual runs)
        if: runner.environment == 'self-hosted' && github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Root = 'C:\murmur-ci-out'
          if (-not (Test-Path -LiteralPath $Root -PathType Container)) {
            Write-Host "::notice::$Root does not exist on this runner; desktop hand-off skipped (docs/ci-windows.md)."
            exit 0
          }
          # Defender may still hold freshly written files open: retry deletes.
          function Remove-Retrying([string]$Path) {
            for ($Try = 1; $Try -le 10; $Try++) {
              try { Remove-Item -LiteralPath $Path -Recurse -Force -ErrorAction Stop; return }
              catch { if ($Try -eq 10) { throw }; Start-Sleep -Seconds 2 }
            }
          }
          $Commit = $env:GITHUB_SHA
          $Version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $Files = @(
            ".cache/artifacts/windows/Murmur_${Version}_x64-setup.exe",
            '.cache/artifacts/windows/murmur-windows-x86_64.zip',
            ".cache/artifacts/components-windows/murmur-engine-windows-x86_64-$Version.zip",
            ".cache/artifacts/components-windows/murmur-cuda-windows-x86_64-$Version.zip",
            '.cache/artifacts/components-windows/components-manifest.json',
            '.cache/artifacts/components-windows/components-manifest.json.sig',
            '.cache/artifacts/components-windows/murmur-release.asc',
            '.cache/artifacts/components-windows/components-windows-inputs.json'
          )
          foreach ($File in $Files) { if (-not (Test-Path -LiteralPath $File)) { throw "Missing hand-off file $File" } }
          # Folder ACLs are inherited from C:\murmur-ci-out (set when Edison was provisioned).
          $Dest = Join-Path $Root $Commit
          if (Test-Path -LiteralPath $Dest) { Remove-Retrying $Dest }
          New-Item -ItemType Directory -Path $Dest | Out-Null
          foreach ($File in $Files) { Copy-Item -LiteralPath $File -Destination $Dest }
          $Sums = foreach ($File in (Get-ChildItem -LiteralPath $Dest -File | Sort-Object Name)) {
            $Hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $File.FullName).Hash.ToLowerInvariant()
            # The desktop job compares the folder against these log lines (gh run view --log).
            Write-Host "MURMUR-HANDOFF-SHA256 $Commit $Hash $($File.Name)"
            "$Hash  $($File.Name)"
          }
          [IO.File]::WriteAllText((Join-Path $Dest 'SHA256SUMS'), (($Sums -join "`n") + "`n"))
          # Keep the newest three commits.
          Get-ChildItem -LiteralPath $Root -Directory | Where-Object { $_.Name -match '^[0-9a-f]{40}$' } |
            Sort-Object LastWriteTimeUtc -Descending | Select-Object -Skip 3 |
            ForEach-Object { Write-Host "Pruning $($_.Name)"; Remove-Retrying $_.FullName }
          "Desktop hand-off: ``$Dest`` ($($Files.Count) files + SHA256SUMS)." | Out-File $env:GITHUB_STEP_SUMMARY -Append
