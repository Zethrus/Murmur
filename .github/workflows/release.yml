name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

jobs:
  prepare:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '["ubuntu-22.04"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create or resume a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/check-release.py version "$GITHUB_REF_NAME"
          if gh release view "$GITHUB_REF_NAME" --json isDraft > release-state.json; then
            python3 -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Published releases are immutable; use a new version"'
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "Murmur $GITHUB_REF_NAME" --notes-file docs/release-notes.md
          fi
  # Windows (vars.ENABLE_WINDOWS == 'true', Edison runner): builds the installer, portable zip
  # and component zips and attaches them to the draft; its component inputs go to the Linux job,
  # which signs one manifest for both platforms.
  windows-build:
    needs: prepare
    # Tags build only on the real Windows runner, never on a billing-locked hosted one.
    if: vars.ENABLE_WINDOWS == 'true' && vars.WINDOWS_RUNNER != ''
    uses: ./.github/workflows/windows-build.yml
    secrets: inherit
  windows:
    needs: windows-build
    if: needs['windows-build'].result == 'success'
    outputs:
      windows_inputs: ${{ needs['windows-build'].outputs.windows_inputs }}
    permissions:
      contents: write
    runs-on: ${{ fromJSON(vars.WINDOWS_RUNNER || '["windows-latest"]') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify and attach staged Windows assets to the draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ATTEMPT: ${{ needs['windows-build'].outputs.stage_attempt }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:BUILD_ATTEMPT -notmatch '^[1-9][0-9]*$') { throw 'Windows build stage attempt is missing' }
          $Version = $env:GITHUB_REF_NAME.TrimStart('v')
          py -3.12 scripts/ci-release-stage.py verify `
            --tool-cache $env:RUNNER_TOOL_CACHE --run-id $env:GITHUB_RUN_ID `
            --attempt $env:BUILD_ATTEMPT --sha $env:GITHUB_SHA --version $Version
          if ($LASTEXITCODE -ne 0) { throw 'Windows release stage verification failed' }
          $Stage = Join-Path $env:RUNNER_TOOL_CACHE ('murmur-release-stage\{0}-{1}' -f $env:GITHUB_RUN_ID, $env:BUILD_ATTEMPT)
          $Draft = gh release view $env:GITHUB_REF_NAME --json isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $Draft.isDraft) { throw 'Draft release is unavailable or already published' }
          gh release upload $env:GITHUB_REF_NAME `
            (Join-Path $Stage "Murmur_${Version}_x64-setup.exe") `
            (Join-Path $Stage 'murmur-windows-x86_64.zip') `
            (Join-Path $Stage "murmur-engine-windows-x86_64-${Version}.zip") `
            (Join-Path $Stage "murmur-cuda-windows-x86_64-${Version}.zip") --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
  linux-build:
    needs: [prepare, windows-build, windows]
    if: >-
      always() && needs.prepare.result == 'success' &&
      ((needs['windows-build'].result == 'success' && needs.windows.result == 'success') ||
       (vars.ENABLE_WINDOWS != 'true' && needs['windows-build'].result == 'skipped' && needs.windows.result == 'skipped'))
    uses: ./.github/workflows/linux-build.yml
  linux:
    needs: [linux-build, windows-build, windows]
    if: >-
      always() && needs['linux-build'].result == 'success' &&
      ((needs['windows-build'].result == 'success' && needs.windows.result == 'success') ||
       (vars.ENABLE_WINDOWS != 'true' && needs['windows-build'].result == 'skipped' && needs.windows.result == 'skipped')) &&
      vars.MURMUR_RELEASE_TRUST_FINGERPRINT != ''
    permissions:
      contents: write
      actions: read
    environment: release-signing
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '["ubuntu-22.04"]') }}
    timeout-minutes: 120
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare isolated build caches
        run: python3 scripts/ci-cache.py prepare
      - name: Record starting resources and cache sizes
        run: python3 scripts/ci-cache.py start
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ${{ runner.environment != 'self-hosted' && 'npm' || '' }}
      - uses: dtolnay/rust-toolchain@1.100.0
      - name: Verify pinned Rust version
        run: test "$(rustc --version | cut -d' ' -f2)" = 1.100.0
      - name: The committed trust root must be the configured release key
        env:
          EXPECTED: ${{ vars.MURMUR_RELEASE_TRUST_FINGERPRINT }}
        run: |
          set -euo pipefail
          grep -q "RELEASE_PRIMARY_FINGERPRINT: &str = \"$EXPECTED\"" src-tauri/src/components/trust.rs
          actual="$(gpg --batch --with-colons --show-keys src-tauri/trust/murmur-release.asc | awk -F: '/^fpr/ {print $10; exit}')"
          test "$actual" = "$EXPECTED"
      - name: Fetch the Windows component zips from the draft (when Windows is enabled)
        if: needs.windows.outputs.windows_inputs != ''
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_INPUTS: ${{ needs.windows.outputs.windows_inputs }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          windows="$RUNNER_TEMP/windows-components"
          rm -rf "$windows" && mkdir -p "$windows"
          printf '%s\n' "$WINDOWS_INPUTS" > "$windows/components-windows-inputs.json"
          gh release download "$GITHUB_REF_NAME" --dir "$windows" \
            --pattern "murmur-engine-windows-x86_64-$version.zip" --pattern "murmur-cuda-windows-x86_64-$version.zip"
          # make-manifest.py re-checks both zips against these hashes before signing them.
          echo "MURMUR_WINDOWS_COMPONENTS=$windows" >> "$GITHUB_ENV"
      - name: Build, sign with the release subkey and test
        env:
          MURMUR_SIGNING_SUBKEY: ${{ secrets.MURMUR_SIGNING_SUBKEY }}
          MURMUR_SIGNING_PASSPHRASE: ${{ secrets.MURMUR_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$MURMUR_SIGNING_SUBKEY" || { echo 'MURMUR_SIGNING_SUBKEY is not set in the release-signing environment' >&2; exit 1; }
          scripts/build-linux.sh
          python3 scripts/check-release.py signature .cache/artifacts/components "${{ vars.MURMUR_RELEASE_TRUST_FINGERPRINT }}"
      - name: Validate final Linux assets on trusted GPU hardware
        env:
          MURMUR_GPU_TEST_MODELS: ${{ vars.MURMUR_GPU_TEST_MODELS }}
        run: |
          set -euo pipefail
          test -n "$MURMUR_GPU_TEST_MODELS" || { echo 'Set MURMUR_GPU_TEST_MODELS to an offline staged model directory on the trusted runner.' >&2; exit 1; }
          command -v nvidia-smi >/dev/null || { echo 'Trusted NVIDIA GPU runner required for release.' >&2; exit 1; }
          python3 scripts/test-linux-inference.py --artifacts .cache/artifacts/linux \
            --components .cache/artifacts/components --models-dir "$MURMUR_GPU_TEST_MODELS"
      - name: Release guard - no throwaway-signed manifest in the shipped binary
        # build-linux.sh embeds the manifest it just signed. The binary must carry the release
        # subkey's signature (the committed certificate checked above), never a throwaway one.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 scripts/check-embedded-manifest.py --trusted-cert src-tauri/trust/murmur-release.asc \
            "$CARGO_TARGET_DIR/release/murmur"
      - name: Attach Linux assets and components to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            .cache/artifacts/linux/*.AppImage \
            .cache/artifacts/linux/*.deb \
            .cache/artifacts/linux/murmur-linux-x86_64.tar.gz \
            .cache/artifacts/linux/GPU-VALIDATION.json \
            .cache/artifacts/components/murmur-*-linux-x86_64-*.zip \
            .cache/artifacts/components/components-manifest.json \
            .cache/artifacts/components/components-manifest.json.sig \
            .cache/artifacts/components/murmur-release.asc --clobber
      - name: Record final resources and cache sizes
        if: always()
        run: python3 scripts/ci-cache.py finish
  flipper:
    needs: prepare
    permissions:
      contents: write
    timeout-minutes: 20
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '["ubuntu-22.04"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ufbt
        run: |
          python -m pip install --upgrade pip
          python -m pip install ufbt
      - name: Prepare the SDK
        run: ufbt update --channel=release
      - name: Sync the companion version with Murmur
        run: python3 companion/flipper/scripts/sync_version.py --check
      - name: Test the wire parser
        run: |
          cc -std=c11 -Wall -Wextra -o /tmp/protocol_test companion/tests/protocol_test.c companion/flipper/src/protocol.c
          /tmp/protocol_test
      - name: Build the app
        run: ufbt
        working-directory: companion/flipper
      - name: Verify the artifact
        run: test -s dist/murmur_companion.fap
        working-directory: companion/flipper
      - name: Attach to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true
          cp companion/flipper/dist/murmur_companion.fap "murmur-companion-${GITHUB_REF_NAME}.fap"
          gh release upload "$GITHUB_REF_NAME" "murmur-companion-${GITHUB_REF_NAME}.fap" --clobber
  # Windows GPU validation of the FINAL signed assets on Edison (NVIDIA): tied to the release by
  # hash. Until it has passed for a release, the Windows GPU option stays hidden in the app
  # (components::detect::WINDOWS_GPU_OFFERED = false).
  windows-gpu:
    needs: [windows, linux]
    if: >-
      always() && needs.linux.result == 'success' &&
      needs.windows.outputs.windows_inputs != '' && vars.WINDOWS_GPU_TEST_MODELS != ''
    runs-on: [self-hosted, Windows, X64, gpu, nvidia]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Validate the released Windows engine and cuBLAS add-on on the GPU
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_GPU_TEST_MODELS: ${{ vars.WINDOWS_GPU_TEST_MODELS }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command nvidia-smi -ErrorAction SilentlyContinue)) { throw 'NVIDIA runner required' }
          $Version = $env:GITHUB_REF_NAME.TrimStart('v')
          $Assets = Join-Path $env:RUNNER_TEMP 'windows-release'
          if (Test-Path $Assets) { Remove-Item $Assets -Recurse -Force }
          gh release download $env:GITHUB_REF_NAME --dir $Assets `
            --pattern "Murmur_${Version}_x64-setup.exe" --pattern 'murmur-windows-x86_64.zip' `
            --pattern "murmur-*-windows-x86_64-$Version.zip" `
            --pattern components-manifest.json --pattern components-manifest.json.sig --pattern murmur-release.asc
          if ($LASTEXITCODE -ne 0) { throw 'Download from the draft failed' }
          # The release certificate, accepted through the same CLI path as the Linux check.
          python scripts/test-windows-inference.py --artifacts $Assets --components $Assets --models-dir $env:WINDOWS_GPU_TEST_MODELS
          if ($LASTEXITCODE -ne 0) { throw 'Windows GPU validation failed' }
          gh release upload $env:GITHUB_REF_NAME (Join-Path $Assets 'GPU-VALIDATION-windows.json') --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Evidence upload failed' }
  validate:
    needs: [linux, flipper, windows-build, windows, windows-gpu]
    if: >-
      always() && needs.linux.result == 'success' && needs.flipper.result == 'success' &&
      ((needs['windows-build'].result == 'success' && needs.windows.result == 'success') ||
       (vars.ENABLE_WINDOWS != 'true' && needs['windows-build'].result == 'skipped' && needs.windows.result == 'skipped')) &&
      (needs.windows-gpu.result == 'success' || needs.windows-gpu.result == 'skipped')
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '["ubuntu-22.04"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify all assets and retain the draft for testing
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS: ${{ needs.windows.outputs.windows_inputs != '' && '--windows' || '' }}
          WINDOWS_GPU: ${{ needs.windows-gpu.result == 'success' && '--windows-gpu' || '' }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "$GITHUB_REF_NAME" --dir release-assets
          # Never publishes: the draft stays a draft for manual testing.
          flags=()
          if [[ -n "$WINDOWS" ]]; then flags+=("$WINDOWS"); fi
          if [[ -n "$WINDOWS_GPU" ]]; then flags+=("$WINDOWS_GPU"); fi
          python3 scripts/check-release.py assets "$GITHUB_REF_NAME" release-assets "${flags[@]}"
          if [ -n "$WINDOWS" ] && [ -z "$WINDOWS_GPU" ]; then
            echo 'Windows assets verified WITHOUT GPU evidence: the Windows GPU option must stay hidden.' >> "$GITHUB_STEP_SUMMARY"
          fi
          # The manifest must be signed by the release key the app pins.
          test -n "${{ vars.MURMUR_RELEASE_TRUST_FINGERPRINT }}"
          python3 scripts/check-release.py signature release-assets "${{ vars.MURMUR_RELEASE_TRUST_FINGERPRINT }}"
          (cd release-assets && sha256sum --check SHA256SUMS)
          gh release upload "$GITHUB_REF_NAME" release-assets/SHA256SUMS --clobber
