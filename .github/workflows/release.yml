name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '["ubuntu-22.04"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create or resume a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/check-release.py version "$GITHUB_REF_NAME"
          if gh release view "$GITHUB_REF_NAME" --json isDraft > release-state.json; then
            python3 -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Published releases are immutable; use a new version"'
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "Murmur $GITHUB_REF_NAME" --notes-file docs/release-notes.md
          fi
  linux:
    needs: prepare
    uses: ./.github/workflows/linux-build.yml
  flipper:
    needs: prepare
    uses: ./.github/workflows/flipper-build.yml
  # Windows and Android are deferred. See docs/roadmap.md.
  publish:
    needs: [linux, flipper]
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '["ubuntu-22.04"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify all assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "$GITHUB_REF_NAME" --dir release-assets
          python3 scripts/check-release.py assets "$GITHUB_REF_NAME" release-assets
          (cd release-assets && sha256sum --check SHA256SUMS)
          gh release upload "$GITHUB_REF_NAME" release-assets/SHA256SUMS --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
