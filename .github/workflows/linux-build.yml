name: Linux build

on:
  # Releases build on v* tags through release.yml. Branch pushes do not trigger a full build:
  # one self-hosted runner means every push would queue a 20-minute job, and Actions artifact
  # storage on this account is small.
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  # Write is needed to attach assets when a v* tag is pushed; fork PRs never run on the
  # self-hosted runner (see the job-level `if:`), so untrusted code never holds this token.
  contents: write

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Fork PRs must never execute on a self-hosted runner; keep them on hosted or skip.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || vars.LINUX_RUNNER == ''
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '["ubuntu-22.04"]') }}
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
      TMPDIR: ${{ github.workspace }}/.cache/tmp
      PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
    steps:
      - uses: actions/checkout@v4
      - name: Prepare temporary directory
        run: mkdir -p "$TMPDIR" "$PIP_CACHE_DIR"
      - name: Provision runner dependencies
        run: |
          set -euo pipefail
          # Hosted runners start bare; a self-hosted machine usually already has the stack and
          # must not require passwordless sudo.
          if pkg-config --exists webkit2gtk-4.1 libsoup-3.0 alsa; then
            echo "Build dependencies already present; skipping apt install."
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev \
            build-essential pkg-config patchelf libxkbcommon-dev libx11-dev \
            libgtk-3-dev librsvg2-bin file
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Isolate the CI Rust toolchain
        run: |
          set -euo pipefail
          # Self-hosted machines already have rustup in $HOME; a CI install over it fails with
          # "could not rename component ... Directory not empty" and mutates the desktop toolchain.
          root="${RUNNER_TOOL_CACHE:-$HOME/.cache}/murmur-ci"
          mkdir -p "$root/rustup" "$root/cargo"
          printf 'RUSTUP_HOME=%s\n' "$root/rustup" >> "$GITHUB_ENV"
          printf 'CARGO_HOME=%s\n' "$root/cargo" >> "$GITHUB_ENV"
          printf '%s\n' "$root/cargo/bin" >> "$GITHUB_PATH"
          rustup target list --installed 2>/dev/null || true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Build frozen engine
        run: |
          python -m venv --system-site-packages engine/.venv
          engine/.venv/bin/python -m pip install -r engine/requirements.txt pyinstaller
          scripts/engine-sidecar.sh --build
          test -s src-tauri/binaries/murmur-engine-x86_64-unknown-linux-gnu
      - run: npm ci
      - run: npm run build
      - name: Build app, deb and AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npx tauri build
      - name: Verify and stage unsigned artifacts
        run: |
          set -euo pipefail
          release="$CARGO_TARGET_DIR/release"
          test -s "$release/murmur"
          mkdir -p .cache/artifacts/linux
          install -m755 "$release/murmur" .cache/artifacts/linux/murmur
          install -m755 src-tauri/binaries/murmur-engine-x86_64-unknown-linux-gnu \
            .cache/artifacts/linux/murmur-engine
          cp "$release"/bundle/deb/*.deb .cache/artifacts/linux/
          cp "$release"/bundle/appimage/*.AppImage .cache/artifacts/linux/
          tar -C .cache/artifacts/linux -czf .cache/artifacts/linux/murmur-linux-x86_64.tar.gz \
            murmur murmur-engine
      - name: Publish Linux assets to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Unsigned builds. Windows runtime and GPU behavior remain unverified on real Windows hardware.
            Portable archives include the required adjacent engine sidecar; keep the pair together.
            Models are not bundled: install a model explicitly in Settings → Engine.
          files: .cache/artifacts/linux/*
          fail_on_unmatched_files: true
      - name: Upload build artifacts (best effort)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: murmur-linux-x86_64
          path: .cache/artifacts/linux/*
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
